<!-- Imagens são elementos que permitem exibir imagens em uma página web
  - tag <img>
    - atributo src: especifica o endereço da imagem
    - atributo alt: especifica o texto alternativo da imagem, que é exibido caso a imagem não possa ser carregada
    - atributo width: especifica a largura da imagem
    - atributo height: especifica a altura da imagem -->

<img src="https://revistacampoenegocios.com.br/wp-content/uploads/2018/07/Foto-01-Cr%C3%A9dito-Shutterstock10.jpg" alt="goiaba" width="272" height="92"> <!-- exibe a imagem de uma goiaba -->
