<!-- Colocando codigos no html sem bugar -->

<p> texto</p> <!-- veja a diferença entre <p> e <code>  -->
<code> texto </code> <!-- aqui ele muda a formatação da fonte para ficar igual ao código -->

<!-- grealmente vamos usar o code dentro do pre, fazendo um aninhamento de código, como no exemplo abaixo -->

<pre> <!-- pre indica que o texto dentro dele vai ser pré formatado, ou seja, ele vai manter a formatação do código, alem de que dai ele vai respeitar os espaços e quebras de linha coisa que o p ou o code não fazem -->
  <code> texto </code> <!-- code indica que o texto dentro dele é um código -->
</pre>

<!-- Se eu quiser escrever literalmente a tag <code> por exemplo, eu posso usar as entidades HTML: &lt;code&gt; veja abaixo -->
  <code>&lt;code&gt;</code>
  <!-- -O &lt; representa a abertura de uma tag HTML
    -O &gt; representa o fechamento de uma tag HTML -->
