<!-- 
  <nav> o nav serve para agrupar links de navegação, geralmente é usado para criar menus de navegação
  <section> o section serve para agrupar conteúdo relacionado, geralmente é usado para criar seções na página
  <article> o article serve para representar um conteúdo independente e reutilizável, como um artigo em um blog ou uma notícia 
-->



<nav><a href="#">Início</a> <a href="#"> pode colocar links</a> 
  <ul>
    <li>colocar listas tambem</li>
    <li>home</li>
  </ul>
</nav><!-- voce pode o nav colocar dentro do header -->

<main>
<article>
  <section>
      <h1>Título do Artigo</h1>
  <p>Conteúdo do artigo.</p> </section>
</article></main><!-- um article deve conter um título e conteúdo independente e eleserve para escrever artigos ou notícias, e voce pode colocar ele dentro de um section pada dividir as seções e ele quase sempre vai estar dentro de uma tag main -->

<section id="home">
  <h2>Seção Home</h2>
  <p>Conteúdo da seção Home.</p>
 </section><!-- é recomendado que dentro de um section voce coloque um h2  -->
<!-- ela poderia estar dentro de um aside -->

<aside><section id="projetos">
  <h2>Seção Projetos</h2>
  <p>Conteúdo da seção Projetos.</p>
 </section></aside>
