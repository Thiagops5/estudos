<!-- 
  <header> é o cabeçalho da página, geralmente contém o título e a navegação principal
  <main> é o conteúdo principal da página
  <aside> é uma seção lateral, geralmente contém informações relacionadas ao conteúdo principal
  <footer> é o rodapé da página, geralmente contém informações de copyright e links úteis
-->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <header><h1>Título da página</h1></header><!-- exemplo de header -->
    <main><p>Este é o conteúdo principal da página.</p></main><!-- exemplo de main -->
    <aside><p>Informações adicionais ou links úteis.</p></aside><!-- exemplo de aside -->
    <footer><p>© 2024 Meu Site. Todos os direitos reservados.</p></footer><!-- exemplo de footer -->
  </body>
  </html>
