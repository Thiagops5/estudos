<!-- os links são elementos que permitem navegar entre páginas web
 - tag <a>
   - atributo href: especifica o endereço da página para a qual o link aponta -
   url,fragmento,target que são os tipos de endereço que podem ser especificados no href
   - url: endereço de uma página web
  - fragmento: endereço de uma parte específica de uma página web
  - target: especifica onde abrir o link, se na mesma aba ou em uma nova aba
      - _self: abre o link na mesma aba (padrão)
      - _blank: abre o link em uma nova aba
      - _parent: abre o link na aba pai
      - _top: abre o link na aba principal -->

      <a href="https://github.com/Thiagops5/api-server">meu projeto da api</a><!-- redireciona para uma pagina web -->

      <a href="#trabalhos">ver trabalhos</a><!-- redireciona para uma parte específica da mesma página -->
      
      <div id="trabalhos">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Accusantium impedit sequi repellat tenetur est nam laboriosam, nihil mollitia aut quae repellendus autem culpa eum? Dolorum deleniti amet cupiditate aliquid alias?</div>
